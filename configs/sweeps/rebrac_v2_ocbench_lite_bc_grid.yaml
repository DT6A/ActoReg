program: algorithms/rebrac_v2_ocbench.py
command:
- ${env}
- PYTHONPATH=.
- python3
- ${program}
- ${args}
method: grid
metric:
  goal: maximize
  name: eval/normalized_score_mean
parameters:
  config_path:
    values:
    - configs/offline/rebrac-v2-ocbench/lite/block/block-lite-double-task1-v0.yaml
    - configs/offline/rebrac-v2-ocbench/lite/block/block-lite-double-task2-v0.yaml
    - configs/offline/rebrac-v2-ocbench/lite/block/block-lite-single-task1-v0.yaml
    - configs/offline/rebrac-v2-ocbench/lite/chamber/chamber-lite-easy-task1-v0.yaml
    - configs/offline/rebrac-v2-ocbench/lite/chamber/chamber-lite-easy-task2-v0.yaml
    - configs/offline/rebrac-v2-ocbench/lite/chamber/chamber-lite-easy-task3-v0.yaml
    - configs/offline/rebrac-v2-ocbench/lite/chamber/chamber-lite-medium-task1-v0.yaml
    - configs/offline/rebrac-v2-ocbench/lite/chamber/chamber-lite-medium-task2-v0.yaml
    - configs/offline/rebrac-v2-ocbench/lite/hanoi/hanoi-lite-double-task1-v0.yaml
    - configs/offline/rebrac-v2-ocbench/lite/hanoi/hanoi-lite-double-task2-v0.yaml
    - configs/offline/rebrac-v2-ocbench/lite/hanoi/hanoi-lite-single-task1-v0.yaml
    - configs/offline/rebrac-v2-ocbench/lite/hanoi/hanoi-lite-single-task2-v0.yaml
    - configs/offline/rebrac-v2-ocbench/lite/switch/switch-lite-3x3-task1-v0.yaml
    - configs/offline/rebrac-v2-ocbench/lite/switch/switch-lite-3x3-task2-v0.yaml
    - configs/offline/rebrac-v2-ocbench/lite/switch/switch-lite-4x4-task1-v0.yaml
    - configs/offline/rebrac-v2-ocbench/lite/switch/switch-lite-4x4-task2-v0.yaml
  actor_bc_aux_weight:
    values:
    - 0.03
    - 0.1
    - 0.5
    - 1.0
  actor_bc_coef:
    values:
    - 0.0001
    - 0.001
    - 0.003
    - 0.01
  train_seed:
    values:
    - 0
    - 1
    - 2
    - 3
  group:
    value: rebrac-v2-ocbench-lite-bc-grid
